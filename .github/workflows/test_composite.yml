name: diff

on: push

jobs:
  test-composite:
    runs-on: ubuntu-latest
    steps:
      - run: python --version
      - uses: BarbossHack/reproducible-MacOS/.github/actions/apkdiff@master
        with:
          APKS_A: one.apk
          APKS_B: two.apk
          IGNORE_FILES: |-
            META-INF/FDROID.RSA
            META-INF/FDROID.SF
