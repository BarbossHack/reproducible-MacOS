name: diff

on: push

jobs:
  test-composite:
    runs-on: ubuntu-latest
    steps:
      - uses: BarbossHack/reproducible-MacOS/.github/actions/apkdiff@master
        with:
          APKS_A: |-
            one.apk
            one-2.apk
          APKS_B: |-
            two.apk
            two-2.apk
          IGNORE_FILES: |-
            META-INF/FDROID.RSA
            META-INF/FDROID.SF
