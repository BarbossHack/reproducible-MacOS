name: dev

on:
  push:

jobs:
  dev:
    runs-on: macos-26
    steps:
      - run: |
          set -x
          curl -L "https://github.com/BarbossHack/reproducible-LFS/raw/refs/heads/master/Xcode/0bc538ab0cfa107625f77ad7bcfa566abe43e917.asset.zip" -o 0bc538ab0cfa107625f77ad7bcfa566abe43e917.asset.zip

          rm -rf /Applications/Xcode.app
          ditto /Applications/Xcode_26.2.app /Applications/Xcode.app
          rm -rf /Applications/Xcode_*
          echo DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer >> "$GITHUB_ENV"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo ls -lsah /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/
          sleep 2
          sudo ls -lsah /private/var/run/com.apple.security.cryptexd/mnt/
          sleep 2
          sudo rm -rf /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/*.asset
          sudo unzip 0bc538ab0cfa107625f77ad7bcfa566abe43e917.asset.zip -d /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/0bc538ab0cfa107625f77ad7bcfa566abe43e917.asset/
          sudo chown -R _nsurlsessiond:wheel /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/0bc538ab0cfa107625f77ad7bcfa566abe43e917.asset/
          sleep 1
          sudo ls -lsah /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/
          sleep 2
          sudo ls -lsah /private/var/run/com.apple.security.cryptexd/mnt/
          sleep 5

          sudo mkdir -p /Library/Developer/Toolchains/
          sudo cp -R /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/0bc538ab0cfa107625f77ad7bcfa566abe43e917.asset/AssetData/Metal.xctoolchain /Library/Developer/Toolchains/Metal_850.xctoolchain

          cat /Library/Developer/Toolchains/Metal_850.xctoolchain/ToolchainInfo.plist
          sleep 5
          cat /Library/Developer/Toolchains/Metal_850.xctoolchain/ToolchainInfo.plist | grep -A1 Identifier
          sleep 5

          export TOOLCHAINS=Metal_850

          # xcodebuild -downloadComponent MetalToolchain
          sleep 5
          xcrun metal --version
