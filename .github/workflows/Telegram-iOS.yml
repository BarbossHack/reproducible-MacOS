name: Telegram-iOS

on:
  push:

jobs:
  applestore-verify:
    runs-on: macos-26
    steps:
      - name: Install mitmproxy
        run: |
          ls -lsah /Applications/
          echo DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer >> "$GITHUB_ENV"
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

          xcrun metal --version || true
          xcodebuild -version || true
          xcode-select -p || true
