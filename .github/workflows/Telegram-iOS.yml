name: Telegram-iOS

on:
  push:

jobs:
  applestore-verify:
    runs-on: macos-26
    steps:
      - name: build
        run: |
          set -x

          curl -L "https://updates.cdn-apple.com/2025FallFCS/fullrestores/093-37622/CE01FAB2-7F26-48EE-AEE4-5E57A7F6D8BB/UniversalMac_26.0_25A354_Restore.ipsw" -o UniversalMac_26.0_25A354_Restore.ipsw
          hdiutil attach UniversalMac_26.0_25A354_Restore.ipsw
          ls -lsah /Volumes/
          ls -Rlsah /Volumes/UniversalMac\ 26.0\ 25A354\ Restore/
