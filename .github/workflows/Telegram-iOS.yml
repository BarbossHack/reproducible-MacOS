name: Telegram-iOS

on:
  push:

jobs:
  applestore-verify:
    runs-on: macos-26
    steps:
      - name: build
        run: |
          set -x

          for asset in /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/*.asset; do
              echo "=== $(basename $asset) ==="
              find "$asset" -name "*.plist" ! -path "*/Restore/*" \
                -exec plutil -p {} \; 2>/dev/null \
                | grep -i "build\|version\|release"
          done