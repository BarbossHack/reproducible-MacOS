name: Telegram-iOS

on:
  push:

jobs:
  applestore-verify:
    runs-on: macos-26
    steps:
      - name: Install mitmproxy
        run: |
          set -x
          curl -L "https://alt-eu-central-1-12.transferxl-download.com/m-euc1-11/0901eb6beb2ead087dd73db0ad174f87-0.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=VRUC2IB382WVAN635LVP%2F20260607%2Feu-central-1%2Fs3%2Faws4_request&X-Amz-Date=20260607T120009Z&X-Amz-Expires=900&X-Amz-Signature=4654b42b5f4829fca343a40f97e9e4318ed8b698d3b0d990e22b82d41b7316a0&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22TransferXL-08VKqd7HHD9Gg.zip%22" -o xc.zip
          rm -rf /Applications/Xcode*
          unzip xc.zip
          rm xc.zip
          mkdir temp temp2
          xar -xf Xcode_26.2_Release_Candidate_Apple_silicon.xip -C ./temp/
          ls -lsah ./temp/
          file ./temp/Content
          mkdir -p extracted
          ditto -v --rsrc ./temp/Content ./extracted
          ls -lsah ./extracted/
          rm Xcode_26.2_Release_Candidate_Apple_silicon.xip
          ls -la /Applications/

          echo DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer >> "$GITHUB_ENV"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sleep 1
          xcrun metal --version || true
          sleep 1
          xcodebuild -version || true
          sleep 1
          xcode-select -p || true
