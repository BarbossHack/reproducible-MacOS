name: Telegram-iOS

on:
  push:

jobs:
  applestore-verify:
    runs-on: macos-26
    steps:
      - name: build
        run: |
          set -x

          cat ~/.bazelrc || true

          bazel info output_base

          ls -lsah /private/var/tmp/

          ditto /private/var/tmp/_bazel_runner /private/var/tmp/_bazel_containerhost
          rm -rf /private/var/tmp/_bazel_runner

          echo "startup --output_user_root=/private/var/tmp/_bazel_containerhost" >> ~/.bazelrc
          bazel info output_base
